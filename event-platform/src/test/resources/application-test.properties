# Isolated in-memory database for Spring integration tests.
spring.datasource.url=jdbc:h2:mem:user-tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Test-only credentials and signing key (never used outside automated tests).
app.security.admin.username=admin
app.security.admin.password=test-admin-password
app.security.jwt.secret=test-only-jwt-secret-with-at-least-32-chars
app.security.jwt.expiration=PT1H
