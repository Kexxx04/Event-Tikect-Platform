# Profile inmemory: the API runs on the in-memory repositories of com.eventplatform.api.inmemory,
# without PostgreSQL, Flyway or JPA. Used by every test (the test and acceptance profiles include it),
# bootTestRun, bootRunInMemory and build/libs/event-platform-inmemory.jar (E2E, OWASP ZAP and JMeter).
# The DB_* variables are not needed; ADMIN_PASSWORD and JWT_SECRET still are.

# Spring Boot 4.1 moved these classes to one module per technology (spring-boot-jdbc, -hibernate,
# -data-jpa and -flyway). Without a DataSource, the JDBC transaction manager, JdbcTemplate and
# JdbcClient configurations also back off on their own.
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
