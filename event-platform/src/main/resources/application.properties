spring.application.name=event-platform

# Local development: read DB_* (and other) variables from the git-ignored .env file
# that Docker Compose also uses. Real environment variables still take precedence.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/event_platform}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Comma-separated list of browser origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Administrator account and JWT signing key. Define them in .env (local) or as environment variables.
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:}
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration=${JWT_EXPIRATION:PT8H}
