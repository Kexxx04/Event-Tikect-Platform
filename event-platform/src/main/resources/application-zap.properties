# Lab profile for the OWASP ZAP baseline scan run by azure-pipelines.yml (ET0202).
#
# It contains no secrets. The pipeline passes them as environment variables for each run:
# DB_URL / DB_USERNAME / DB_PASSWORD point to a disposable PostgreSQL container, and
# ADMIN_PASSWORD / JWT_SECRET are random values that only live while the scan runs.

# Schema created by Flyway and only validated by Hibernate, same as production.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Never leak internal details in Spring's default /error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# HTTP access log (one line per request with its status code) to document the scan scope.
# The pipeline sets server.tomcat.accesslog.directory to the folder published with the ZAP reports.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.prefix=acceso-http
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.pattern=%t %a "%r" %s %b

logging.level.root=INFO
