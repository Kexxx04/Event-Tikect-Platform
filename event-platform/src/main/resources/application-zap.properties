# Lab profile for the OWASP ZAP API scan run by azure-pipelines.yml (ET0202).
#
# The pipeline runs it together with the inmemory profile on build/libs/event-platform-inmemory.jar
# (task inMemoryBootJar): --spring.profiles.active=inmemory,zap. There is no database, so no DB_*
# variables. It contains no secrets: ADMIN_PASSWORD / JWT_SECRET are random environment variables
# that only live while the scan runs.

# Only used if the zap profile runs on the production bootJar with PostgreSQL: schema created by
# Flyway and only validated by Hibernate. The inmemory profile turns Flyway and JPA off.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# OpenAPI definition at /v3/api-docs (it still requires the JWT). ZAP imports it to call every endpoint,
# because a crawler cannot discover the routes of a JSON API.
springdoc.api-docs.enabled=true
# OpenAPI 3.0 instead of springdoc's default 3.1: ZAP only has initial support for 3.1 definitions.
springdoc.api-docs.version=openapi-3-0

# Never leak internal details in Spring's default /error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# HTTP access log (one line per request with its status code) to document the scan scope.
# The pipeline sets server.tomcat.accesslog.directory to the folder published with the ZAP reports.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.prefix=acceso-http
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.pattern=%t %a "%r" %s %b

logging.level.root=INFO
