# Proyecto completo para el grupo: API + PostgreSQL.
# Primero carga o construye event-platform:1.0.0; luego: docker compose up -d --wait
name: event-platform-team

services:
  api:
    build: .
    image: event-platform:1.0.0
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-event_platform}
      DB_USERNAME: ${POSTGRES_USER:-event_team}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-event_platform}
      POSTGRES_USER: ${POSTGRES_USER:-event_team}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - team-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  team-postgres-data:
