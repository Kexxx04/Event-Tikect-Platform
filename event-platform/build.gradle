import org.springframework.boot.gradle.tasks.bundling.BootJar
import org.springframework.boot.gradle.tasks.run.BootRun

plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id "org.sonarqube" version "7.3.1.8318"
	id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.eventplatform'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

sourceSets {
	// In-memory repositories and transaction manager (profile inmemory): every test runs without a database.
	// Only test, acceptanceTest, bootTestRun, bootRunInMemory and inMemoryBootJar use them;
	// the production bootJar keeps PostgreSQL + Flyway + JPA and does not contain this source set.
	inmemory {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
	test {
		compileClasspath += sourceSets.inmemory.output
		runtimeClasspath += sourceSets.inmemory.output
	}
}

configurations {
	inmemoryImplementation.extendsFrom implementation
	inmemoryRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	// Only /actuator/health is exposed (Docker healthcheck); see application.properties.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// OpenAPI definition only (no Swagger UI); enabled by the zap profile for the OWASP ZAP API scan.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.2.0'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// PIT Mutation Testing
	pitest 'org.pitest:pitest-junit5-plugin:1.2.1'
	//Cucumber
	testImplementation("io.cucumber:cucumber-java:7.34.3")
	testImplementation("io.cucumber:cucumber-junit-platform-engine:7.34.3")
	testImplementation("io.cucumber:cucumber-spring:7.34.3")
	testImplementation 'org.junit.platform:junit-platform-suite'
}

// API without a database (profile inmemory). It still needs ADMIN_PASSWORD and JWT_SECRET (.env or variables).
tasks.register('bootRunInMemory', BootRun) {
	description = 'Runs the API with the in-memory repositories (profile inmemory), without a database.'
	group = 'application'
	mainClass = 'com.eventplatform.api.EventPlatformApplication'
	classpath = sourceSets.main.runtimeClasspath + sourceSets.inmemory.output
	systemProperty 'spring.profiles.active', 'inmemory'
}

// Separate executable jar (main + inmemory) for E2E, OWASP ZAP and JMeter. The production bootJar does not change.
tasks.register('inMemoryBootJar', BootJar) {
	description = 'Assembles build/libs/event-platform-inmemory.jar: the API with the in-memory repositories.'
	group = 'build'
	archiveFileName = 'event-platform-inmemory.jar'
	mainClass = 'com.eventplatform.api.EventPlatformApplication'
	targetJavaVersion = JavaVersion.VERSION_21
	classpath = sourceSets.main.runtimeClasspath + sourceSets.inmemory.output
}

jacoco {
	toolVersion = '0.8.14'
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

test {
	finalizedBy jacocoTestReport
	useJUnitPlatform {
		includeEngines 'junit-jupiter', 'junit-platform-suite'
	}
}

sonar {
	properties {
		property 'sonar.projectKey', 'event-ticket-platform'
		property 'sonar.projectName', 'event-ticket-platform'
		property 'sonar.host.url', providers.environmentVariable('SONAR_HOST_URL').getOrElse('http://localhost:9000')

		property 'sonar.token', providers.environmentVariable('SONAR_TOKEN').getOrElse('')
	}
}

tasks.register('acceptanceTest', Test) {
	description = "Runs Cucumber acceptance tests."
	group = "verification"
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeEngines 'junit-platform-suite'
	}
	filter {
		includeTestsMatching 'runners.RunCucumberTest'
	}
}

pitest {
	// Use Spring Boot's managed launcher instead of PIT's inferred version.
	addJUnitPlatformLauncher = false
	pitestVersion = '1.19.0'
	junit5PluginVersion = '1.2.1'

	targetClasses = ['com.eventplatform.api.*']
	targetTests = ['com.eventplatform.api.*']

	threads = 4
	outputFormats = ['HTML']
	timestampedReports = false
}
