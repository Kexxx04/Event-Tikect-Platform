plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id "org.sonarqube" version "7.3.1.8318"
	id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.eventplatform'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// PIT Mutation Testing
	pitest 'org.pitest:pitest-junit5-plugin:1.2.1'
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

sonar {
	properties {
		property 'sonar.projectKey', 'Event-Ticket-Platform'
		property 'sonar.projectName', 'Event-Ticket-Platform'
		property 'sonar.host.url', 'http://localhost:9000'
		property 'sonar.java.binaries', 'build/classes/java/main'
		property 'sonar.java.test.binaries', 'build/classes/java/test'
		property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'

		// Token leído desde variable de entorno, nunca hardcodeado
		property 'sonar.token', System.getenv('SONAR_TOKEN') ?: ''
	}
}

pitest {
	pitestVersion = '1.19.0'
	junit5PluginVersion = '1.2.1'

	targetClasses = ['com.eventplatform.api.*']
	targetTests = ['com.eventplatform.api.*']

	threads = 4
	outputFormats = ['HTML']
	timestampedReports = false
}

tasks.named('test') {
	useJUnitPlatform()
}
