# Default configuration of the end-to-end tests.
# Serenity only resolves ${...} against Java system properties, so the overrides are done by
# build.gradle: each E2E_* environment variable (or -P Gradle property) becomes a system property,
# and system properties take precedence over the values below. See README.md.

serenity {
  project.name = "Event Platform E2E"
  # One screenshot per UI action, so the report shows every click and field.
  take.screenshots = FOR_EACH_ACTION
  # Every scenario starts with a fresh browser (and therefore without a session).
  restart.browser.for.each = scenario
}

# Visible browser window by default (needed to record the demo video).
# E2E_HEADLESS=true or -Pheadless=true runs without a window.
headless.mode = false

webdriver {
  # Frontend under test (npm run dev). E2E_BASE_URL or -PbaseUrl=... changes it.
  base.url = "http://localhost:5173"
  # Chrome by default; E2E_BROWSER=edge or -Pbrowser=edge selects the "edge" environment below.
  driver = chrome
  # Selenium Manager downloads the matching driver, and Chrome for Testing when Chrome is not installed.
  autodownload = true
  # Maximum time Serenity waits for an element before failing (milliseconds).
  wait.for.timeout = 10000
  timeouts {
    implicitlywait = 2000
  }
  capabilities {
    "goog:chromeOptions" {
      # 1440x900 keeps the desktop layout of the frontend (below 768px the sidebar becomes a top bar).
      args = ["--remote-allow-origins=*", "--window-size=1440,900", "--lang=en-US",
        "--no-first-run", "--no-default-browser-check", "--disable-search-engine-choice-screen",
        "--disable-notifications", "--disable-features=PasswordLeakDetection"]
      prefs {
        credentials_enable_service = false
        profile.password_manager_enabled = false
        profile.password_manager_leak_detection = false
      }
    }
  }
}

# Administrator used by the login scenarios and the Background of the other feature.
# The defaults are the test-only credentials of the API "test" profile
# (event-platform/src/test/resources/application-test.properties). Never write real credentials
# here: use the E2E_ADMIN_USERNAME and E2E_ADMIN_PASSWORD environment variables instead.
e2e {
  admin {
    username = "admin"
    password = "test-admin-password"
  }
  # Event dates are LocalDateTime values compared with the API server clock (Colombia, UTC-5).
  # E2E_TIMEZONE changes it when the API runs in another time zone.
  timezone = "America/Bogota"
}

# Alternative browser: Microsoft Edge (E2E_BROWSER=edge or -Pbrowser=edge).
environments {
  edge {
    webdriver {
      driver = edge
      capabilities {
        browserName = "MicrosoftEdge"
        "ms:edgeOptions" {
          args = ["--remote-allow-origins=*", "--window-size=1440,900", "--lang=en-US",
            "--no-first-run", "--no-default-browser-check", "--disable-notifications",
            "--disable-features=PasswordLeakDetection"]
          prefs {
            credentials_enable_service = false
            profile.password_manager_enabled = false
            profile.password_manager_leak_detection = false
          }
        }
      }
    }
  }
}
